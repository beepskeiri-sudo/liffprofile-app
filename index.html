<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>登録内容変更</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body{
  font-family:sans-serif;
  max-width:600px;
  margin:auto;
  padding:20px;
}

h2{
  text-align:center;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:8px;
}

button{
  width:100%;
  margin-top:20px;
  padding:12px;
  font-size:16px;
}
/* --- 追加：送信中メッセージ（画面オーバーレイ）のスタイル --- */
#loadingOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.6); /* 画面を少し暗くする */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999; /* 一番手前に表示 */
}

/* 非表示にするためのクラス */
.hidden {
  display: none !important;
}

/* 文字の点滅アニメーション設定 */
.blinking-text {
  color: white;
  font-size: 18px;
  font-weight: bold;
  animation: blink 1.2s infinite ease-in-out;
  text-align: center;
}

@keyframes blink {
  0% { opacity: 0.2; }
  50% { opacity: 1.0; }
  100% { opacity: 0.2; }
}

</style>
</head>

<body>

<!-- 追加：送信中に表示するボタンなしのメッセージウインドウ -->
<div id="loadingOverlay" class="hidden">
  <div class="blinking-text">送信を開始します...<br>処理が終わるまでお待ちください。</div>
</div>

<h2>登録内容変更</h2>

<label>氏名</label>
<input id="name">

<label>フリガナ</label>
<input id="kana">

<label>電話番号</label>
<input id="tel">

<label>生年月日</label>
<input id="birth">

<label>銀行名</label>
<input id="bank">

<label>支店名</label>
<input id="branch">

<label>口座番号</label>
<input id="account">

<label>口座名義</label>
<input id="holder">

<label>メールアドレス</label>
<input id="mail">

<button onclick="updateProfile()">
更新する
</button>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbypxG2AgXXfiE0Qhc-pcGTrAjEr2dq2KP3sn0Ir12unQg8lFB1UUumyf4611YNWxZRXLw/exec";

let userId = "";

async function init() {
try {
  await liff.init({
    liffId:"2009820268-pIw2BVGL"
  });

  const profile =
    await liff.getProfile();

  userId = profile.userId;
 
 // 1. GASへの通信（非同期処理）を先に開始する（awaitをつけない）
  const response = await fetch(
  `${GAS_URL}?action=getProfile&userId=${userId}`
);
 
  // 2. 通信の裏でメッセージウインドウを表示し、ユーザーの「OK」待ちにする
   alert("登録情報を表示します。\n変更したい項目のみ表示内容を変更してください。変更しない項目はそのままで入力しないでください。");
  
  // 3. ユーザーが「OK」を押した後、通信結果を待つ（すでに終わっていれば即座に進む）
  const response = await responsePromise;
  
  const data =
    await response.json();

  if(data.result !== "ok"){
    alert("登録情報が見つかりません");
    return;
  }

  document.getElementById("name").value =
    data.name || "";

  document.getElementById("kana").value =
    data.kana || "";

  document.getElementById("tel").value =
    data.tel || "";

  document.getElementById("birth").value =
    data.birth || "";

  document.getElementById("bank").value =
    data.bank || "";

  document.getElementById("branch").value =
    data.branch || "";

  document.getElementById("account").value =
    data.account || "";

  document.getElementById("holder").value =
    data.holder || "";

  document.getElementById("mail").value =
    data.mail || "";
}
catch (err) {
    alert("初期化エラー: " + err.message);
  }
}

// 変更：updateProfile関数
async function updateProfile() {
//1. ボタンなしの点滅更新メッセージを表示（隠していたoverlayを表示）
  const overlay = document.getElementById("loadingOverlay");
  overlay.classList.remove("hidden");

try {  
  const payload = {

    action:"updateProfile",

    userId:userId,

    name:
      document.getElementById("name").value,

    kana:
      document.getElementById("kana").value,

    tel:
      document.getElementById("tel").value,

    birth:
      document.getElementById("birth").value,

    bank:
      document.getElementById("bank").value,

    branch:
      document.getElementById("branch").value,

    account:
      document.getElementById("account").value,

    holder:
      document.getElementById("holder").value,

    mail:
      document.getElementById("mail").value
  };
 
  const response =
    await fetch(GAS_URL, {
      method:"POST",
      mode: "cors", // CORSを明示
      headers:{
        "Content-Type":"text/plain" // application/json から変更（GASのCORS回避の定番手法）
      },
      body:JSON.stringify(payload)
    });

  const result =
    await response.json();
 // 2. 処理が終わったので点滅メッセージを非表示に戻す
    overlay.classList.add("hidden");
 
 // 3. 結果に応じてメッセージを表示
  if(result.result === "ok"){

    alert("変更内容の更新が終了しました");  // 更新終了メッセージ

    liff.closeWindow();

  } else if(result.result === "nochange") {

    alert("変更された項目がありませんでした");

  } else {

    alert("更新できませんでした: " + JSON.stringify(result));
  }
} catch (error) {
    // エラーが起きた場合もメッセージを確実に消す
    overlay.classList.add("hidden");  
    alert("通信エラー発生（詳細）: " + error.message);
  }
}

init();

</script>

</body>
</html>
